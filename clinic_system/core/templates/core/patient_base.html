{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portal - Dr. Pakhare Dental Clinic{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f4f7f6;
            color: #2c3e50;
        }

        .navbar {
            background-color: #0b7a75;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .btn-logout {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-logout:hover {
            background-color: white;
            color: #0b7a75;
        }

        .navbar-logo {
            height: 90px;
            width: auto;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .navbar-logo:hover {
            transform: scale(1.05);
        }

        .portal-header {
            background: linear-gradient(135deg, #0b7a75 0%, #0da39c 100%);
            color: white;
            padding: 50px 0;
            border-radius: 0 0 30px 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(11, 122, 117, 0.2);
        }

        .portal-header h1 {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .portal-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
        }

        .table {
            margin-bottom: 0;
        }

        .table th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
            padding: 15px;
        }

        .table td {
            padding: 15px;
            vertical-align: middle;
            color: #475569;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-scheduled {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .status-checked-in {
            background-color: #fef3c7;
            color: #b45309;
        }

        .status-in-consultation {
            background-color: #f3e8ff;
            color: #6b21a8;
        }

        .status-treated {
            background-color: #dcfce7;
            color: #15803d;
        }

        .status-billed {
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .status-paid {
            background-color: #d1fae5;
            color: #065f46;
        }

        .btn-download {
            background-color: #f8fafc;
            color: #0b7a75;
            border: 1px solid #e2e8f0;
            padding: 6px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-download:hover {
            background-color: #0b7a75;
            color: white;
            border-color: #0b7a75;
        }

        .btn-book {
            background: linear-gradient(135deg, #0b7a75 0%, #0da39c 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-book:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(11, 122, 117, 0.3);
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">
                <img src="{% static 'core/images/clinic_logo.png' %}" alt="Dr. Pakhare Dental Clinic Logo"
                    class="navbar-logo">
            </a>
            <div class="ms-auto">
                <a href="{% url 'logout' %}" class="btn-logout"><i
                        class="fa-solid fa-right-from-bracket me-2"></i>Logout</a>
            </div>
        </div>
    </nav>

    <div id="main-content" class="main-content">
        {% block extra_css %}{% endblock %}
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
